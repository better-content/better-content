[scheduler]
	enabled = true
	disable_vanilla_patrol_spawning = true
	#Range: 1 ~ 1200
	interval_ticks = 20
	#Maximum loaded surface columns sampled across all approaching invasions per scheduler tick.
	#Range: 64 ~ 65536
	surface_sample_budget = 4096

[cadence]
	#Range: 0 ~ 1200000
	first_window_min_ticks = 24000
	#Range: 0 ~ 1200000
	first_window_max_ticks = 36000
	#Range: 0 ~ 1200000
	repeat_window_min_ticks = 24000
	#Range: 0 ~ 1200000
	repeat_window_max_ticks = 48000
	#Range: 0 ~ 24000
	warning_surface_ticks = 600
	#Range: 0 ~ 1200000
	death_grace_ticks = 24000

[scaling]
	#Range: 1 ~ 12000000
	time_tier_ticks = 144000

[approach]
	#Range: 8 ~ 256
	minimum_blocks = 48
	#Range: 8 ~ 384
	maximum_blocks = 72
	#Range: 64 ~ 65536
	maximum_search_expansions = 4096

[cleanup]
	#Range: 200 ~ 144000
	active_idle_ticks = 6000
	#Range: 20 ~ 24000
	target_unavailable_ticks = 1200
