meta:
  schema: bc.quest_graph.v1
  pack: better_content
  minecraft: "1.20.1"
  quest_system: ftbquests

groups:
  guided_progression:
    title: Guided Progression

chapters:
  tech_metallurgy:
    title: Tech Spine — Metal Into Motion
    order: 10
    icon: tconstruct:seared_melter
    group: guided_progression
    filename: spine_tech_metallurgy
    source_refs:
      - docs/progression.md
      - kubejs/config/tech_parenting.json

  pressure_control:
    title: Tech Spine — Pressure Into Control
    order: 20
    icon: pneumaticcraft:pressure_chamber_valve
    group: guided_progression
    filename: spine_pressure_control
    source_refs:
      - docs/progression.md
      - kubejs/config/tech_parenting.json

  fonts_occultism:
    title: Magic Spine — Fonts Into Pacts
    order: 30
    icon: hexerei:mixing_cauldron
    group: guided_progression
    filename: spine_fonts_occultism
    source_refs:
      - docs/progression.md
      - kubejs/config/magic_parenting.json

  blood_command:
    title: Magic Spine — Blood Into Command
    order: 40
    icon: bloodmagic:altar
    group: guided_progression
    filename: spine_blood_command
    source_refs:
      - docs/progression.md
      - kubejs/config/magic_parenting.json

  formal_magic:
    title: Formal Magic — Grammar And Schools
    order: 50
    icon: ars_nouveau:novice_spell_book
    group: guided_progression
    filename: spine_formal_magic
    source_refs:
      - docs/progression.md
      - kubejs/config/formal_magic_domains.json

  adventure_economy:
    title: Adventure Spine — Routes And Recovery
    order: 60
    icon: createdeco:copper_coin
    group: guided_progression
    filename: spine_adventure_economy
    source_refs:
      - docs/progression.md
      - kubejs/config/economy_acquisition.json

  post_ae2:
    title: Post-AE2 — Dangerous Matter
    order: 70
    icon: kubejs:impossible_machine_casing
    group: guided_progression
    filename: spine_post_ae2
    source_refs:
      - docs/progression.md
      - kubejs/config/tech_parenting.json

nodes:
  tech_part_builder:
    type: quest
    title: Shape Real Parts
    chapter: tech_metallurgy
    icon: tconstruct:part_builder
    stage: early
    x: 0
    y: 0
    shape: diamond
    body: |
      Build the Part Builder and learn handles, bindings, and tool parts before metal machines enter the workshop. This is the pack's first manufacturing language.
    tasks:
      - type: item
        item: tconstruct:part_builder
    tags:
      - tech_spine
      - tconstruct
    mods:
      - tconstruct

  tech_seared_melter:
    type: quest
    title: Control The First Melt
    chapter: tech_metallurgy
    icon: tconstruct:seared_melter
    stage: seared
    requires:
      - tech_part_builder
    x: 5.2
    y: 0
    body: |
      Build a Seared Melter and casting table. Copper parts must be poured from molten metal, so this is a capability rather than another crafting-grid tier.
    tasks:
      - type: item
        item: tconstruct:seared_melter
    tags:
      - tech_spine
      - metallurgy
    mods:
      - tconstruct

  tech_smeltery:
    type: quest
    title: Build The Smeltery
    chapter: tech_metallurgy
    icon: tconstruct:smeltery_controller
    stage: seared
    requires:
      - tech_seared_melter
    x: 10.4
    y: 0
    body: |
      Expand into a real Smeltery for alloying, larger batches, and auditable ore yields. Leave room for drains, tanks, and casting stations you can operate repeatedly.
    tasks:
      - type: item
        item: tconstruct:smeltery_controller
    tags:
      - tech_spine
      - metallurgy
    mods:
      - tconstruct

  tech_scorched:
    type: quest
    title: Prove Foundry Heat
    chapter: tech_metallurgy
    icon: tconstruct:scorched_bricks
    stage: seared
    requires:
      - tech_smeltery
    x: 15.6
    y: 0
    body: |
      Produce Scorched Bricks to prove the hotter Foundry route. This heat authority feeds the first true machine casing and later brass-scale manufacturing.
    tasks:
      - type: item
        item: tconstruct:scorched_bricks
    tags:
      - tech_spine
      - foundry
    mods:
      - tconstruct

  tech_andesite_alloy:
    type: quest
    title: Cast Andesite Alloy
    chapter: tech_metallurgy
    icon: create:andesite_alloy
    stage: andesite
    requires:
      - tech_scorched
    x: 20.8
    y: 0
    body: |
      Cast Andesite Alloy on the TConstruct surface. Solid Create mixing and nugget shortcuts are absent, so the alloy carries the metallurgy proof into motion.
    tasks:
      - type: item
        item: create:andesite_alloy
    tags:
      - tech_spine
      - create
    mods:
      - create
      - tconstruct

  tech_hand_crank:
    type: quest
    title: Run A Manual Workshop
    chapter: tech_metallurgy
    icon: create:hand_crank
    stage: andesite
    requires:
      - tech_andesite_alloy
    x: 26
    y: 0
    body: |
      Build the Hand Crank and use it to run the first press and basin. It is the only hand-built positive-SU source, so spend its small stress budget deliberately.
    tasks:
      - type: item
        item: create:hand_crank
    tags:
      - tech_spine
      - manual_power
    mods:
      - create

  tech_deployer:
    type: quest
    title: Earn The Deployer
    chapter: tech_metallurgy
    icon: create:deployer
    stage: andesite
    requires:
      - tech_hand_crank
    x: 31.2
    y: 0
    body: |
      Compact the first Deployer with the hand-cranked press and basin. This cycle break unlocks ordinary Create casing, sequenced machine bodies, and governed power.
    tasks:
      - type: item
        item: create:deployer
    tags:
      - tech_spine
      - automation
    mods:
      - create

  tech_andesite_casing:
    type: quest
    title: Assemble Andesite Machines
    chapter: tech_metallurgy
    icon: kubejs:andesite_machine_casing
    stage: andesite
    requires:
      - tech_deployer
    x: 36.4
    y: 0
    shape: hexagon
    size: 1.2
    body: |
      Sequence an Andesite Machine Casing after the Deployer is real. Presses, mixers, fans, drills, saws, and the first governed power network now become sustainable.
    tasks:
      - type: item
        item: kubejs:andesite_machine_casing
    tags:
      - tech_spine
      - machine_casing
    mods:
      - create
      - kubejs

  tech_brass_casing:
    type: quest
    title: Control Brass Logistics
    chapter: tech_metallurgy
    icon: kubejs:brass_machine_casing
    stage: brass
    requires:
      - tech_andesite_casing
    x: 41.6
    y: 0
    shape: hexagon
    size: 1.2
    body: |
      Build the Brass Machine Casing through alloying, pressing, and controlled assembly. Brass shifts the workshop from bulk movement toward selection, sensing, and routing.
    tasks:
      - type: item
        item: kubejs:brass_machine_casing
    tags:
      - tech_spine
      - machine_casing
    mods:
      - create
      - kubejs

  tech_precision_railway:
    type: quest
    title: Connect The Railway Era
    chapter: tech_metallurgy
    icon: create:railway_casing
    stage: brass
    requires:
      - tech_brass_casing
    x: 46.8
    y: 0
    body: |
      Make Precision Mechanisms and Railway Casing, then use trains and physical routes before digital storage erases local logistics. Distance should remain a real planning cost.
    tasks:
      - type: item
        item: create:precision_mechanism
      - type: item
        item: create:railway_casing
    tags:
      - tech_spine
      - logistics
    mods:
      - create

  pressure_seal:
    type: quest
    title: Make A Pressure Seal
    chapter: pressure_control
    icon: kubejs:pressure_seal
    stage: brass
    x: 0
    y: 0
    shape: diamond
    body: |
      Wash carbon and sulfur and combine them with fermented ethanol to make a Pressure Seal. The seal is the chemistry bootstrap, not permission to store loose gas.
    tasks:
      - type: item
        item: kubejs:pressure_seal
    tags:
      - tech_spine
      - chemistry
    mods:
      - kubejs
      - pneumaticcraft

  pressure_airtight:
    type: quest
    title: Seal The Machine Body
    chapter: pressure_control
    icon: kubejs:airtight_machine_casing
    stage: airtight
    requires:
      - pressure_seal
    x: 5.2
    y: 0
    shape: hexagon
    size: 1.2
    body: |
      Build the Airtight Machine Casing from brass machinery, pressure hardware, and seals. Only this tier makes deliberate gas capture and sealed processing legitimate.
    tasks:
      - type: item
        item: kubejs:airtight_machine_casing
    tags:
      - tech_spine
      - machine_casing
    mods:
      - kubejs
      - pneumaticcraft

  pressure_chamber:
    type: quest
    title: Work Under Pressure
    chapter: pressure_control
    icon: pneumaticcraft:pressure_chamber_valve
    stage: airtight
    requires:
      - pressure_airtight
    x: 10.4
    y: 0
    body: |
      Build a Pressure Chamber with a working valve and safe pressure supply. It becomes the authority for sealed materials, compressed parts, and boundary assemblies.
    tasks:
      - type: item
        item: pneumaticcraft:pressure_chamber_valve
    tags:
      - tech_spine
      - pneumaticcraft
    mods:
      - pneumaticcraft

  pressure_pcb:
    type: quest
    title: Finish Printed Boards
    chapter: pressure_control
    icon: pneumaticcraft:printed_circuit_board
    stage: electrical
    requires:
      - pressure_chamber
    x: 15.6
    y: 0
    body: |
      Finish Printed Circuit Boards with PneumaticCraft assembly. Earlier benches and chemistry may prepare traces and wafers, but completed circuits belong to this surface.
    tasks:
      - type: item
        item: pneumaticcraft:printed_circuit_board
    tags:
      - tech_spine
      - circuits
    mods:
      - pneumaticcraft

  pressure_electrical:
    type: quest
    title: Unite Power And Logic
    chapter: pressure_control
    icon: kubejs:electrical_machine_casing
    stage: electrical
    requires:
      - pressure_pcb
    x: 20.8
    y: 0
    shape: hexagon
    size: 1.2
    body: |
      Assemble the Electrical Machine Casing from pressure, circuit, Power Grid, and OC2R proofs. This is the shared control tier rather than a generic era token.
    tasks:
      - type: item
        item: kubejs:electrical_machine_casing
    tags:
      - tech_spine
      - machine_casing
    mods:
      - kubejs
      - powergrid
      - oc2r

  pressure_powergrid:
    type: quest
    title: Store Controlled Power
    chapter: pressure_control
    icon: powergrid:battery
    stage: electrical
    requires:
      - pressure_electrical
    x: 26
    y: 0
    body: |
      Build a Power Grid battery and redstone relay. Treat electricity as measured infrastructure with storage and switching, not as invisible recipe tax.
    tasks:
      - type: item
        item: powergrid:battery
      - type: item
        item: powergrid:redstone_relay
    tags:
      - tech_spine
      - power_grid
    mods:
      - powergrid

  pressure_oc2r:
    type: quest
    title: Bridge Distant Information
    chapter: pressure_control
    icon: oc2r:computer
    stage: electrical
    requires:
      - pressure_powergrid
    x: 31.2
    y: 0
    body: |
      Build an OC2R computer after the circuit chain is stable. Use it for intersite information and coordination while trains and physical logistics still move matter.
    tasks:
      - type: item
        item: oc2r:computer
    tags:
      - tech_spine
      - intersite_information
    mods:
      - oc2r

  pressure_space:
    type: quest
    title: Manufacture For Distance
    chapter: pressure_control
    icon: kubejs:space_machine_casing
    stage: space
    requires:
      - pressure_oc2r
    x: 36.4
    y: 0
    shape: hexagon
    size: 1.2
    body: |
      Build the Space Machine Casing when oxygen, launch hardware, and long supply lines can be manufactured reliably. A rocket route needs a return plan, not one lucky launch.
    tasks:
      - type: item
        item: kubejs:space_machine_casing
    tags:
      - tech_spine
      - machine_casing
    mods:
      - creatingspace
      - kubejs

  pressure_ae2:
    type: quest
    title: Introduce Local Intelligence
    chapter: pressure_control
    icon: ae2:controller
    stage: ae2
    requires:
      - pressure_space
    x: 41.6
    y: 0
    body: |
      Build an AE2 Controller only after processors, pressure, and launch-scale logistics are solved. AE2 sharpens one site; it does not replace intersite transport.
    tasks:
      - type: item
        item: ae2:controller
    tags:
      - tech_spine
      - local_intelligence
    mods:
      - ae2

  pressure_impossible:
    type: quest
    title: Finish The Casing Ladder
    chapter: pressure_control
    icon: kubejs:impossible_machine_casing
    stage: ae2
    requires:
      - pressure_ae2
    x: 46.8
    y: 0
    shape: octagon
    size: 1.2
    body: |
      Stabilize Raw Impossible Casing with AE2 processors and final Blood Magic proof. This closes the structural machine ladder and opens explicitly post-AE2 work.
    tasks:
      - type: item
        item: kubejs:raw_impossible_casing
      - type: item
        item: kubejs:impossible_machine_casing
    tags:
      - tech_spine
      - machine_casing
    mods:
      - ae2
      - bloodmagic
      - kubejs

  fonts_read_route:
    type: quest
    title: Read A Dimension Font
    chapter: fonts_occultism
    icon: minecraft:written_book
    stage: adventure
    x: 0
    y: 0
    shape: diamond
    body: |
      Use Dimension Drink fonts as route surfaces: prepare the destination, its hazards, and the way home before drinking. The journey is the first proof in this tradition.
    tasks:
      - type: checkmark
        title: Prepare and use a dimension font route
    tags:
      - fonts_spine
      - route
    mods:
      - dimension_drink

  fonts_cauldron:
    type: quest
    title: Work The Mixing Cauldron
    chapter: fonts_occultism
    icon: hexerei:mixing_cauldron
    stage: magic_1
    requires:
      - fonts_read_route
    x: 5.6
    y: 0
    body: |
      Build Hexerei's Mixing Cauldron and stage herbs, bottles, candles, and woods around it. Folk magic begins as place-bound preparation rather than portable spell power.
    tasks:
      - type: item
        item: hexerei:mixing_cauldron
    tags:
      - fonts_spine
      - hexerei
    mods:
      - hexerei

  fonts_book:
    type: quest
    title: Keep A Book Of Shadows
    chapter: fonts_occultism
    icon: hexerei:book_of_shadows
    stage: magic_1
    requires:
      - fonts_cauldron
    x: 11.2
    y: 0
    body: |
      Make the Book of Shadows and use it as the working record for cauldron, broom, and ritual preparation. Keep this infrastructure near its real materials.
    tasks:
      - type: item
        item: hexerei:book_of_shadows
    tags:
      - fonts_spine
      - hexerei
    mods:
      - hexerei

  fonts_otherstone:
    type: quest
    title: Open The Otherstone Boundary
    chapter: fonts_occultism
    icon: occultism:otherstone
    stage: magic_2
    requires:
      - fonts_book
    x: 16.8
    y: 0
    shape: hexagon
    size: 1.15
    body: |
      Mix Otherstone through Hexerei with Otherside matter and a reinforced slate. This recurring Occultism substrate is the boundary between folk practice and spirit pacts.
    tasks:
      - type: item
        item: occultism:otherstone
    tags:
      - fonts_spine
      - native_anchor
    mods:
      - hexerei
      - occultism
      - bloodmagic

  fonts_dictionary:
    type: quest
    title: Study The Spirit Dictionary
    chapter: fonts_occultism
    icon: occultism:dictionary_of_spirits
    stage: magic_2
    requires:
      - fonts_otherstone
    x: 22.4
    y: 0
    body: |
      Craft the Dictionary of Spirits and read the ritual requirements before placing a circle. Occultism trades portable convenience for prepared sites and negotiated entities.
    tasks:
      - type: item
        item: occultism:dictionary_of_spirits
    tags:
      - fonts_spine
      - occultism
    mods:
      - occultism

  fonts_first_pact:
    type: quest
    title: Prepare The First Pact
    chapter: fonts_occultism
    icon: occultism:golden_sacrificial_bowl
    stage: magic_3
    requires:
      - fonts_dictionary
    x: 28
    y: 0
    shape: octagon
    size: 1.15
    body: |
      Make the Golden Sacrificial Bowl and prepare a complete circle before summoning. Containment, ingredients, and the entity's role should all be decided before the pact begins.
    tasks:
      - type: item
        item: occultism:golden_sacrificial_bowl
    tags:
      - fonts_spine
      - pact
    mods:
      - occultism

  blood_heart:
    type: quest
    title: Bring Back A Life
    chapter: blood_command
    icon: rpgstats:still_beating_heart
    stage: magic_1
    x: 0
    y: 0
    shape: diamond
    body: |
      Return from death with a Still-Beating Heart that records the life you actually lived. Save this milestone for Blood Magic instead of treating it as bulk fuel.
    tasks:
      - type: item
        item: rpgstats:still_beating_heart
    tags:
      - blood_spine
      - death_loop
    mods:
      - rpgstats
      - bloodmagic

  blood_altar:
    type: quest
    title: Build The Blood Altar
    chapter: blood_command
    icon: bloodmagic:altar
    stage: magic_1
    requires:
      - blood_heart
    x: 5.2
    y: 0
    body: |
      Build the Blood Altar with your heart and Otherside matter. Give it room for runes, storage, safe sacrifice, and later rituals before the room becomes crowded.
    tasks:
      - type: item
        item: bloodmagic:altar
    tags:
      - blood_spine
      - bloodmagic
    mods:
      - bloodmagic

  blood_weak_orb:
    type: quest
    title: Bind The Weak Orb
    chapter: blood_command
    icon: bloodmagic:weakbloodorb
    stage: magic_1
    requires:
      - blood_altar
    x: 10.4
    y: 0
    body: |
      Bind a Weak Blood Orb and make a Divination Sigil before repeated sacrifice. Blood work becomes manageable only when LP cost and capacity stop being guesses.
    tasks:
      - type: item
        item: bloodmagic:weakbloodorb
    tags:
      - blood_spine
      - bloodmagic
    mods:
      - bloodmagic

  blood_blank_slate:
    type: quest
    title: Refine Blank Slates
    chapter: blood_command
    icon: bloodmagic:blankslate
    stage: magic_1
    requires:
      - blood_weak_orb
    x: 15.6
    y: 0
    shape: hexagon
    size: 1.1
    body: |
      Produce Blank Slates reliably. They are the first durable Blood proof and the entry authority for Malum materials and common formal-magic work.
    tasks:
      - type: item
        item: bloodmagic:blankslate
    tags:
      - blood_spine
      - slate
    mods:
      - bloodmagic

  blood_malum_altar:
    type: quest
    title: Raise A Spirit Altar
    chapter: blood_command
    icon: malum:spirit_altar
    stage: magic_1
    requires:
      - blood_blank_slate
    x: 20.8
    y: 0
    body: |
      Build Malum's Spirit Altar and capture spirits in their native vessels. This side tradition inherits Blood proof while keeping its own reagents, risks, and transformations.
    tasks:
      - type: item
        item: malum:spirit_altar
      - type: item
        item: malum:spirit_jar
    tags:
      - blood_spine
      - malum
    mods:
      - malum

  blood_spool:
    type: quest
    title: Infuse The Esoteric Spool
    chapter: blood_command
    icon: malum:esoteric_spool
    stage: magic_1
    requires:
      - blood_malum_altar
    x: 26
    y: 0
    body: |
      Spirit-infuse the Esoteric Spool with a Blank Slate. The spool is a recurring native Malum hub, so this one boundary controls many later equipment uses.
    tasks:
      - type: item
        item: malum:esoteric_spool
    tags:
      - blood_spine
      - native_anchor
    mods:
      - malum
      - bloodmagic

  blood_reinforced:
    type: quest
    title: Hold Reinforced Costs
    chapter: blood_command
    icon: bloodmagic:reinforcedslate
    stage: magic_2
    requires:
      - blood_spool
    x: 31.2
    y: 0
    shape: hexagon
    size: 1.1
    body: |
      Refine Reinforced Slates when the altar can sustain larger LP jobs. This proof advances Malum manufacturing and opens stronger cross-tradition utility.
    tasks:
      - type: item
        item: bloodmagic:reinforcedslate
    tags:
      - blood_spine
      - slate
    mods:
      - bloodmagic

  blood_impetus:
    type: quest
    title: Build Alchemical Impetus
    chapter: blood_command
    icon: malum:alchemical_impetus
    stage: magic_2
    requires:
      - blood_reinforced
    x: 36.4
    y: 0
    body: |
      Spirit-infuse Alchemical Impetus with a Reinforced Slate. This recurring Malum component carries the middle Blood tier into consequential alchemical machines.
    tasks:
      - type: item
        item: malum:alchemical_impetus
    tags:
      - blood_spine
      - native_anchor
    mods:
      - malum
      - bloodmagic

  blood_infused:
    type: quest
    title: Stabilize Infused Slates
    chapter: blood_command
    icon: bloodmagic:infusedslate
    stage: magic_3
    requires:
      - blood_impetus
    x: 41.6
    y: 0
    shape: hexagon
    size: 1.1
    body: |
      Refine Infused Slates for stable hybrid magic and higher Malum metallurgy. Repeated production should be safe before you spend them on downstream systems.
    tasks:
      - type: item
        item: bloodmagic:infusedslate
    tags:
      - blood_spine
      - slate
    mods:
      - bloodmagic

  blood_soul_steel:
    type: quest
    title: Stain Steel With Souls
    chapter: blood_command
    icon: malum:soul_stained_steel_ingot
    stage: magic_3
    requires:
      - blood_infused
    x: 46.8
    y: 0
    body: |
      Spirit-infuse Soul-Stained Steel with an Infused Slate. The ingot is Malum's late manufactured hub and should remain tied to both spirit work and Blood depth.
    tasks:
      - type: item
        item: malum:soul_stained_steel_ingot
    tags:
      - blood_spine
      - native_anchor
    mods:
      - malum
      - bloodmagic

  blood_demonic:
    type: quest
    title: Enter Demonic Work
    chapter: blood_command
    icon: bloodmagic:demonslate
    stage: magic_4
    requires:
      - blood_soul_steel
    x: 52
    y: 0
    shape: hexagon
    size: 1.15
    body: |
      Refine Demonic Slates only after LP supply, ritual space, and personal safety are stronger than the craft. This is the authority for dangerous command magic.
    tasks:
      - type: item
        item: bloodmagic:demonslate
    tags:
      - blood_spine
      - slate
    mods:
      - bloodmagic

  blood_goety_altar:
    type: quest
    title: Construct The Dark Altar
    chapter: blood_command
    icon: goety:dark_altar
    stage: magic_4
    requires:
      - blood_demonic
    x: 57.2
    y: 0
    body: |
      Construct Goety's Dark Altar and keep command magic inside prepared infrastructure. Summons and focuses should cost containment, cursed matter, and deliberate staging.
    tasks:
      - type: item
        item: goety:dark_altar
    tags:
      - blood_spine
      - goety
    mods:
      - goety

  blood_goety_focus:
    type: quest
    title: Author A Command Focus
    chapter: blood_command
    icon: goety:empty_focus
    stage: magic_4
    requires:
      - blood_goety_altar
    x: 62.4
    y: 0
    body: |
      Make an Empty Focus and bind a specific Goety operation through its native altar route. The focus records dangerous intent rather than granting a free spell family.
    tasks:
      - type: item
        item: goety:empty_focus
    tags:
      - blood_spine
      - command_magic
    mods:
      - goety

  blood_ethereal:
    type: quest
    title: Reach Ethereal Proof
    chapter: blood_command
    icon: bloodmagic:etherealslate
    stage: magic_5
    requires:
