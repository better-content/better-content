name: Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          curl --fail --location --retry 3 \
            --output forge-1.20.1-47.4.13-installer.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.13/forge-1.20.1-47.4.13-installer.jar
      - name: Run supported smoke evaluation
        run: |
          ./smoke.sh &
          smoke_pid=$!
          while kill -0 "$smoke_pid" 2>/dev/null; do
            echo "smoke evaluation is still running"
            sleep 30
          done
          wait "$smoke_pid"
