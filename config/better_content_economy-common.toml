[wanderingTrader]
	#Replaces the vanilla random wandering-trader chance with one shared recurring world visitor.
	#Vanilla meeting-point placement, biome exclusions, llamas, gamerules, and despawning remain in use.
	recurringVisits = true
	#Ticks from first enabled world load to the first visit. Default: two Minecraft days.
	#Range: 0 ~ 2147483647
	initialDelay = 48000
	#Ticks between successful visits. Default: five Minecraft days.
	#Range: 1200 ~ 2147483647
	visitInterval = 120000
	#Ticks before retrying a due visit when vanilla cannot find a valid spawn position.
	#Range: 20 ~ 24000
	retryDelay = 1200
	#Broadcasts the themed trader's dimension and exact block coordinates after a scheduled arrival.
	announceArrival = true
